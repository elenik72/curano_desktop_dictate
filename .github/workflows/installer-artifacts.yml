name: "Installer Artifacts"

# Manual installer builds for downloading platform installers from Actions
# artifacts. macOS builds are signed and notarized; release publishing stays
# in release.yml.

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installers:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            sign-binaries: true
          - platform: "macos-26-intel"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            sign-binaries: true
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
            sign-binaries: false
          - platform: "ubuntu-24.04" # Build .deb, AppImage and RPM on 24.04
            args: "--bundles deb,appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
            sign-binaries: false

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "curano-ai-dictate"
      upload-artifacts: true
      sign-binaries: ${{ matrix.sign-binaries }}
    secrets: inherit
